services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: calorie_coach_pg
    environment:
      POSTGRES_DB: calorie_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calorie_coach"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: